[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proehn"
version = "1.0.0"
description = "ProEHN: context-aware evolutionary hazard network for cancer progression."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research use only"}
authors = [
  {name = "ProEHN authors"}
]
dependencies = [
  "jax>=0.4.20",
  "jaxlib>=0.4.20",
  "flax>=0.8.0",
  "optax>=0.2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0"
]

[tool.setuptools.packages.find]
include = ["proehn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
