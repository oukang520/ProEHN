project_name: ProEHN
random_seed: 42

kinetic:
  d_model: 128
  n_head_layers: 2
  dropout_rate: 0.2
  stop_threshold: 0.90
  fallback_go_probability: 0.85

topology:
  top_n_genes: 20
  max_batch_size: 1
  max_active_events: 18
  regularization_strength: 0.01
  l1_ratio: 1.0
  log_rate_clip_min: -20.0
  log_rate_clip_max: 20.0
  optimizer_maxiter: 500
  use_bio_pure_features: false
  core_drivers:
    - KRAS
    - TP53
    - SMAD4
    - CDKN2A

artifacts:
  kinetic_params: artifacts/proehn_kinetic_paca.msgpack
  kinetic_metadata: artifacts/proehn_kinetic_paca_metadata.pkl
  topology_model: artifacts/proehn_topology_paca.npz
